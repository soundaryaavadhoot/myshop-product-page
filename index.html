<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">

                    <h2 class="text-center mb-4">Electricity Bill Calculator</h2>
                    <label class="form-label">Enter Units</label>
                    <input type="number" id="units" class="form-control mb-3" placeholder="Enter electricity units">
                    <button id="calculateBtn" class="btn btn-primary w-100"> Calculate Bill</button>
                    <div id="result" class="mt-4"></div>

                </div>
            </div>
        </div>
    </div>


    <script src="script.js"></script>

</body>
</html>
